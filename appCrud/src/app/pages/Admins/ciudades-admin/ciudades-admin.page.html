<ion-header>
  <ion-toolbar>
    <ion-title>Ciudades</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-item>
    <ion-label>Filtrar por país</ion-label>
    <ion-select [(ngModel)]="paisSeleccionado" (ionChange)="filtrarPorPais()">
      <ion-select-option value="">Todos</ion-select-option>
      <ng-container *ngFor="let pais of paises">
        <ion-select-option [value]="pais._id">
          {{ pais.nombre }}
        </ion-select-option>
      </ng-container>
    </ion-select>
  </ion-item>

  <app-ciudades-list
    [ciudades]="ciudadesFiltradas"
    titulo="Listado"
    subtitulo="Ciudades"
    (ciudadBorrada)="cargarCiudades()"
  ></app-ciudades-list>
</ion-content>
