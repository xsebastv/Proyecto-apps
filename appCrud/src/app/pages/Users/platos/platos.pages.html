<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start" *ngIf="paisId">
      <ion-button (click)="regresarAlPais()">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Platos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Platos</ion-title>
    </ion-toolbar>
  </ion-header>

  <app-platos-list
    [platos]="platos"
    [titulo]="titulo"
    [subtitulo]="subtitulo"
  ></app-platos-list>
</ion-content>
