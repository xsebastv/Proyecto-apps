<ion-list class="ion-padding-top">
  <ion-list-header>
    <ion-label>
      <strong>{{ titulo }} - {{ subtitulo }}</strong>
    </ion-label>
  </ion-list-header>

  <ion-card *ngFor="let ciudad of ciudadesMostradas">
    <ion-item lines="none" class="ciudad-item" (click)="verCiudad(ciudad._id)">
      <div class="ciudad-thumb">
        <img *ngIf="ciudad.imagen; else sinImagen" [src]="ciudad.imagen" alt="Imagen ciudad" />
        <ng-template #sinImagen>
          <div class="sin-imagen">
            <ion-icon name="business-outline" size="large"></ion-icon>
          </div>
        </ng-template>
      </div>
      <ion-label>
        <div class="ciudad-info">
          <h2>
            <ion-icon name="business-outline"></ion-icon>
            {{ ciudad.nombre || 'Sin nombre' }}
          </h2>
          <div class="ciudad-detalles">
            <span *ngIf="ciudad.pais">
              <ion-icon name="flag-outline"></ion-icon>
              {{ ciudad.pais.nombre }}
            </span>
            <span *ngIf="ciudad.poblacion">
              <ion-icon name="people-outline"></ion-icon>
              {{ ciudad.poblacion | number:'1.0-0' }}
            </span>
          </div>
        </div>
      </ion-label>
    </ion-item>
  </ion-card>

  <ion-infinite-scroll threshold="100px" (ionInfinite)="loadData($event)">
    <ion-infinite-scroll-content
      loadingSpinner="bubbles"
      loadingText="Cargando más ciudades...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-list>

<ion-modal [isOpen]="isModalOpen" (willDismiss)="onWillDismiss($event)">
  <ng-template>
    <ion-header>
      <ion-toolbar color="primary">
        <ion-buttons slot="start">
          <ion-button (click)="cancel()">Atras</ion-button>
        </ion-buttons>
        <ion-title>
          Detalles de la Ciudad
        </ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <app-ciudades-view *ngIf="ciudadIdSeleccionada" [ciudadId]="ciudadIdSeleccionada"></app-ciudades-view>
    </ion-content>
  </ng-template>
</ion-modal>
