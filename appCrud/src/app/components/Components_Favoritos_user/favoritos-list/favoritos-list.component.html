<ng-container *ngIf="cargando">
  <ion-spinner></ion-spinner> Cargando favoritos...
</ng-container>
<ion-list *ngIf="!cargando && favoritos && favoritos.length > 0">
  <ion-card *ngFor="let fav of favoritos">
    <ion-card-header>
      <ion-card-title>{{ fav.nombre }}</ion-card-title>
      <ion-card-subtitle *ngIf="fav.tipo">{{ fav.tipo }}</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <p *ngIf="fav.descripcion">
        <strong>Descripción:</strong>
        <span>{{ fav.descripcion }}</span>
      </p>
      <p *ngIf="fav.direccion">
        <strong>Dirección:</strong>
        <span>{{ fav.direccion }}</span>
      </p>
      <p>
        <strong>ID:</strong>
        <span>{{ fav._id }}</span>
      </p>
    </ion-card-content>
  </ion-card>
</ion-list>
<ng-container *ngIf="!cargando && (!favoritos || favoritos.length === 0)">
  <ion-text color="medium">No tienes sitios favoritos.</ion-text>
</ng-container>
