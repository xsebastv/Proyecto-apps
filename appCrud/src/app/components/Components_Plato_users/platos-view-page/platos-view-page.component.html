<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="volverACiudad()">
        <ion-icon name="arrow-back" slot="start"></ion-icon>
        Volver
      </ion-button>
    </ion-buttons>
    <ion-title>
      Detalles del Plato
    </ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-card *ngIf="plato">
    <ion-card-content>
      <div class="plato-thumb grande">
        <img *ngIf="plato.imagen" [src]="plato.imagen" alt="Imagen plato" />
        <div *ngIf="!plato.imagen" class="sin-imagen">
          <ion-icon name="image-outline" size="large"></ion-icon>
          Sin imagen
        </div>
      </div>
      <div class="plato-titulos">
        <h2>
          <ion-icon name="restaurant-outline"></ion-icon>
          {{ plato.nombre }}
        </h2>
        <h3>
          <ion-icon name="cash-outline"></ion-icon>
          {{ plato.precio }}
        </h3>
      </div>
      <div class="info-extra">
        <p class="descripcion-block">
          <ion-icon name="document-text-outline"></ion-icon>
          <strong>Descripción:</strong>
          <br>
          <span class="descripcion-texto">{{ plato.descripcion }}</span>
        </p>
        <p *ngIf="nombrePais">
          <ion-icon name="flag-outline"></ion-icon>
          <strong>País:</strong> {{ nombrePais }}
        </p>
        <p *ngIf="nombreCiudad">
          <ion-icon name="business-outline"></ion-icon>
          <strong>Ciudad:</strong> {{ nombreCiudad }}
        </p>
        <p>
          <ion-icon [name]="plato.disponible ? 'checkmark-circle-outline' : 'close-circle-outline'"></ion-icon>
          <strong>Disponible:</strong> {{ plato.disponible ? 'Sí' : 'No' }}
        </p>
        <p>
          <ion-icon name="pricetag-outline"></ion-icon>
          <strong>ID:</strong> {{ plato._id }}
        </p>
      </div>
      <ion-button expand="block" color="primary" (click)="volverACiudad()">
        <ion-icon name="arrow-back" slot="start"></ion-icon>
        Volver a la ciudad
      </ion-button>
    </ion-card-content>
  </ion-card>
  <ion-card *ngIf="!plato">
    <ion-card-content>
      <ion-spinner></ion-spinner> Cargando información del plato...
    </ion-card-content>
  </ion-card>
</ion-content>
